# Production Compose (Synology / Docker hosts).
# Default: pull prebuilt images from GHCR (see .github/workflows/docker-images.yml).
# Local build fallback: add -f compose.build.yaml (or: make prod-build).
#
# Usage:
#   docker compose -f compose.prod.yaml --env-file deploy/compose/.env.prod pull
#   docker compose -f compose.prod.yaml --env-file deploy/compose/.env.prod up -d
name: growth-planet

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-成长星球}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?APP_KEY must be set in deploy/compose/.env.prod}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?APP_URL must be set in deploy/compose/.env.prod}
  APP_LOCALE: ${APP_LOCALE:-zh_CN}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-daily}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE:-growth_planet}
  DB_USERNAME: ${MYSQL_USER:-growth_planet}
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in deploy/compose/.env.prod}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS must be set}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  CACHE_STORE: ${CACHE_STORE:-database}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  TMDB_API_KEY: ${TMDB_API_KEY:-}
  HOMEWORK_LLM_PROVIDER: ${HOMEWORK_LLM_PROVIDER:-auto}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  QWEN_MODEL: ${QWEN_MODEL:-qwen-turbo}

x-app-image: &app-image
  image: ${PHP_IMAGE:-ghcr.io/ggaoph-lab/growth-planet-php:main}
  env_file:
    - deploy/compose/.env.prod
  environment:
    <<: *app-env
  volumes:
    - app-storage:/var/www/backend/storage/app
    - app-logs:/var/www/backend/storage/logs
    - ./deploy/docker/php/php.prod.ini:/usr/local/etc/php/conf.d/zzz-growth-planet-prod.ini:ro
    - ./deploy/docker/php/php-fpm.prod.conf:/usr/local/etc/php-fpm.d/zz-growth-planet.conf:ro
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in deploy/compose/.env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-growth_planet}
      MYSQL_USER: ${MYSQL_USER:-growth_planet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in deploy/compose/.env.prod}
    volumes:
      - mysql-data:/var/lib/mysql
    # Not published to the host. Backups use `docker compose exec`.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  app:
    <<: *app-image
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *app-image
    environment:
      <<: *app-env
      SKIP_CONFIG_CACHE: "1"
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  scheduler:
    <<: *app-image
    environment:
      <<: *app-env
      SKIP_CONFIG_CACHE: "1"
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/ggaoph-lab/growth-planet-nginx:main}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/docker/nginx/prod.conf:/etc/growth-planet/nginx/prod.conf:ro
      - ./deploy/docker/nginx/prod-ssl.conf:/etc/growth-planet/nginx/prod-ssl.conf:ro
      # Serve /storage/* (Wanx poem art, etc.) from the same disk the app writes.
      - app-storage:/var/www/backend/storage/app:ro
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  # Kept as project-default name `growth-planet_mysql-data` for NAS continuity.
  # Local `compose.yaml` uses a different project + volume so Mac preview and
  # `make up` no longer fight over MYSQL_PASSWORD.
  mysql-data:
  app-storage:
  app-logs:
