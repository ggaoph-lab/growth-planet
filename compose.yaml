# Local dev stack. Separate project name + volume from compose.prod.yaml so
# `make preview` / prod env passwords cannot overwrite this MySQL data dir.
name: growth-planet-dev

x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE:-growth_planet}
  DB_USERNAME: ${MYSQL_USER:-growth_planet}
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env (run make init)}

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env (run make init)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-growth_planet}
      MYSQL_USER: ${MYSQL_USER:-growth_planet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env (run make init)}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-33061}:3306"
    healthcheck:
      # mysqladmin ping succeeds even with a wrong password; SELECT verifies auth.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent && mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
      target: dev
      args:
        PHP_BASE: ${PHP_BASE:-php:8.4-fpm-bookworm}
    image: growth-planet-php:dev
    environment:
      <<: *app-env
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
      # Nested mount so Vue vite rebuilds cannot wipe Word Atlas (雅思星球).
      - ./apps/word-atlas/dist:/var/www/frontend/dist/ielts:ro
    depends_on:
      - app

volumes:
  # Explicit name so a one-time migrate from the old shared volume is easy, and
  # so this never collides with compose.prod.yaml's growth-planet_mysql-data.
  mysql-data:
    name: growth-planet_dev_mysql_data
