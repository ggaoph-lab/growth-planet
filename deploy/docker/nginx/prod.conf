server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    # Re-resolve app after container recreate (Compose DNS). Upstream{} caches IPs forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.aliyuncs.com https://*.alicdn.com; media-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.bilibili.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    root /var/www/frontend/dist;
    index index.html;

    # Frontend / nginx liveness (no upstream dependency).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Laravel API, Sanctum CSRF cookie, and backend health.
    location ~ ^/(api|sanctum)(/|$) {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.aliyuncs.com https://*.alicdn.com; media-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.bilibili.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Laravel public disk (poetry Wanx mirrors, etc.). Volume: app-storage → storage/app.
    location ^~ /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Word Atlas · 雅思星球 (React, hash router under /ielts/)
    # Media is content-addressed enough to cache long; JSON catalog/entries must revalidate.
    location ^~ /ielts/atlas/img/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /ielts/atlas/audio/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /ielts/atlas/thumb/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /ielts/atlas/ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /ielts/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /ielts/sfx/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /ielts/sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /ielts/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /ielts/index.html;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
