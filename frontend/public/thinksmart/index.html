<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>成长星球 · 家庭信息中心</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;color:#172233;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}button,a,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1320px;margin:auto;min-height:100vh;padding:22px;display:flex;flex-direction:column;gap:16px}.head{display:flex;align-items:start;justify-content:space-between;gap:20px}.kicker{font-weight:700;color:#526681;letter-spacing:.03em}.clock{font-size:clamp(56px,8vw,96px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0}.date{font-size:19px;color:#637185}.actions{display:flex;gap:10px}.actions button,.actions a,.button{border:0;border-radius:16px;padding:14px 20px;min-height:54px;text-decoration:none;font-weight:750}.actions a{background:#e8eef8;color:#25456d}.actions button,.button{background:#2968e8;color:white}.card{background:white;border:1px solid #e3e9ef;border-radius:26px;padding:22px;box-shadow:0 8px 24px #1424380a}.tasks{flex:1}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row h1{font-size:27px;margin:0}.sub{color:#697a90}.list{display:grid;gap:10px;margin-top:16px}.task{display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:62px;border-radius:17px;background:#f5f7fa;text-decoration:none;color:inherit}.mark{width:28px;height:28px;border:2px solid #8b98a8;border-radius:50%;flex:none;display:grid;place-items:center}.done .mark{border-color:#169b5b;background:#169b5b;color:white}.task strong{font-size:21px;flex:1}.status{color:#657386}.done .status{color:#128149}.tip{background:#eaf1ff;border-radius:21px;padding:18px 22px;display:flex;align-items:center;gap:18px}.tip p{margin:5px 0 0;color:#5d6f86}.tip button{margin-left:auto;background:white;border:1px solid #b9cef5;border-radius:13px;padding:12px;min-height:48px}.notice{font-size:14px;color:#68788b}.sheet{position:fixed;inset:0;background:#13253caa;display:none;align-items:center;justify-content:center;padding:16px}.sheet.open{display:flex}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;background:white;border-radius:25px;padding:22px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0}.x{width:46px;height:46px;border:0;border-radius:50%;background:#e9edf3;font-size:26px}.messages{height:min(42vh,350px);overflow:auto;display:flex;flex-direction:column;gap:10px;margin:18px 0}.bubble{padding:12px 15px;border-radius:15px;max-width:88%;white-space:pre-wrap;line-height:1.5}.me{align-self:flex-end;background:#dce9ff}.bot{align-self:flex-start;background:#f0f3f7}.form{display:flex;gap:8px}.form textarea{flex:1;min-width:0;min-height:60px;resize:vertical;border:1px solid #aebbd0;border-radius:13px;padding:10px}.form button{border:0;border-radius:13px;background:#2968e8;color:white;padding:0 20px}.small{font-size:14px;color:#64758b}.error{color:#b32938}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #f2aa17;outline-offset:2px}@media(max-width:700px){.wrap{padding:14px}.head{flex-wrap:wrap}.actions{width:100%}.actions>*{flex:1;text-align:center}.clock{font-size:64px}.task strong{font-size:18px}.tip{flex-wrap:wrap}.tip button{margin-left:0}}
</style><script src="/thinksmart/app.js" defer></script></head><body><main class="wrap"><header class="head"><div><div class="kicker">成长星球 · 家庭信息中心</div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div><div class="actions"><a href="/kid/tasks">完整任务</a><button id="aiButton">✦ AI 对话</button></div></header><section class="card tasks"><div class="row"><h1>今天的任务</h1><span class="sub" id="progress">连接中…</span></div><div class="list" id="taskList"><p class="sub">正在读取成长星球任务…</p></div></section><section class="tip"><span aria-hidden="true" style="font-size:30px">🔊</span><div><strong>今日提醒</strong><p id="reminder">任务加载后可朗读待办</p></div><button id="speak">朗读</button></section><div class="notice" id="notice">任务和完成状态来自成长星球；点击任务可进入原任务页完成规定步骤。</div></main><div class="sheet" id="chatSheet" role="dialog" aria-modal="true" aria-label="家庭 AI 对话"><div class="dialog"><div class="dialog-head"><h2>家庭 AI 对话</h2><button class="x" id="closeChat" aria-label="关闭">×</button></div><p class="small">使用家长在成长星球配置的千问或 OpenAI 模型。对话仅在当前页面显示，离开页面后清除。</p><div class="messages" id="messages" aria-live="polite"></div><form class="form" id="chatForm"><textarea id="prompt" maxlength="500" placeholder="想问什么？" aria-label="输入问题" required></textarea><button id="send" type="submit">发送</button></form><p class="small error" id="chatError"></p></div></div></body></html>
